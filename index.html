<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#2F8F6B" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1815" media="(prefers-color-scheme: dark)">
  <title>¿Puedo comerlo? · SII/FODMAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    :root{
      color-scheme:light dark;
      /* Marca y semáforo (modo claro) */
      --marca:#2F8F6B;        /* verde de marca: rellenos y acentos */
      --marca-d:#27795A;      /* hover / active */
      --on-marca:#ffffff;     /* texto sobre relleno de marca */
      --verde:#1B6E48;        /* "apto": texto y veredicto */
      --verde-bg:#E9F4EC; --verde-borde:#C4E2CF;
      --amar:#8A5A00;         /* "según ración" */
      --amar-bg:#FBF2DC; --amar-borde:#EFDCA6;
      --rojo:#A8362A;         /* "evitar" (terracota, no rojo de alarma) */
      --rojo-bg:#FBEBE7; --rojo-borde:#F1C9C1;
      /* Neutros cálidos */
      --txt:#2A2724; --gris:#6E6760; --linea:#EBE4DA;
      --fondo:#FAF7F2; --sup:#ffffff; --sup-2:#F4EEE5;
      /* Forma y profundidad */
      --radio:14px;
      --sombra:0 1px 2px rgba(40,30,20,.04),0 4px 14px rgba(40,30,20,.05);
      /* Tipografía */
      --ui:'Hanken Grotesk',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      --display:'Fraunces',Georgia,"Times New Roman",serif;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --marca:#5FBE96; --marca-d:#74CBA6; --on-marca:#10231A;
        --verde:#86D6AD; --verde-bg:#1E2C24; --verde-borde:#2F4A3A;
        --amar:#E7C374; --amar-bg:#2C2718; --amar-borde:#4A3F22;
        --rojo:#F1A99C; --rojo-bg:#2E1F1B; --rojo-borde:#4E342D;
        --txt:#EDE7DD; --gris:#A89F93; --linea:#352F27;
        --fondo:#1A1815; --sup:#241F18; --sup-2:#2E2920;
        --sombra:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.4);
      }
    }
    *{box-sizing:border-box}
    ::selection{background:rgba(47,143,107,.22)}
    body{margin:0;font-family:var(--ui);
      color:var(--txt);background:var(--fondo);line-height:1.55;-webkit-text-size-adjust:100%;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    #app{max-width:560px;margin:0 auto;padding:16px 14px 56px}
    header h1{font-family:var(--display);font-size:1.85rem;font-weight:600;letter-spacing:-.01em;
      margin:.1em 0 .3em;display:flex;align-items:center;gap:.3em}
    h2{font-size:1.25rem;font-weight:600;margin:.4em 0}
    .ficha-cab h2{font-family:var(--display);font-size:1.6rem;font-weight:600;margin:.15em 0}
    .aviso{font-size:.82rem;color:var(--gris);background:var(--sup);border:1px solid var(--linea);
      padding:10px 12px;border-radius:10px;margin:0 0 14px;box-shadow:var(--sombra)}
    #q{width:100%;font-size:1.1rem;padding:14px 16px;border:2px solid var(--linea);
      border-radius:14px;outline:none;background:var(--sup);color:var(--txt);font-family:inherit;
      transition:border-color .15s,box-shadow .15s}
    #q::placeholder{color:var(--gris);opacity:.85}
    #q:focus{border-color:var(--marca);box-shadow:0 0 0 4px rgba(47,143,107,.16)}
    .seguros{display:inline-flex;align-items:center;gap:7px;margin:12px 2px;font-size:.95rem;cursor:pointer}
    .seguros input{width:18px;height:18px;accent-color:var(--marca)}
    .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
    .chip{flex:0 0 auto;border:1px solid var(--linea);background:var(--sup);color:var(--txt);border-radius:999px;
      padding:8px 14px;font-size:.9rem;cursor:pointer;white-space:nowrap;font-family:inherit;
      transition:background .15s,color .15s,border-color .15s}
    .chip.activo{background:var(--marca);color:var(--on-marca);border-color:var(--marca)}
    .conteo{font-size:.8rem;color:var(--gris);margin:2px 2px 8px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-top:4px}
    .card{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;
      border:1px solid var(--linea);border-radius:var(--radio);padding:13px;background:var(--sup);cursor:pointer;
      font-family:inherit;font-size:1rem;color:var(--txt);box-shadow:var(--sombra);
      transition:transform .12s ease,box-shadow .15s ease}
    .card:hover{box-shadow:0 2px 6px rgba(40,30,20,.07),0 8px 20px rgba(40,30,20,.08)}
    .card:active{transform:scale(.97)}
    .card .emoji{font-size:1.5rem;line-height:1}
    .card-nombre{font-weight:600}
    .card-cat{font-size:.75rem;color:var(--gris)}
    .card.nivel-verde{background:var(--verde-bg);border-color:var(--verde-borde)}
    .card.nivel-amarillo{background:var(--amar-bg);border-color:var(--amar-borde)}
    .card.nivel-rojo{background:var(--rojo-bg);border-color:var(--rojo-borde)}
    .vacio{color:var(--gris);text-align:center;padding:28px 10px}
    .ficha{background:var(--sup);border-radius:16px;padding:18px;border:1px solid var(--linea);box-shadow:var(--sombra)}
    .ficha.nivel-verde{border-top:5px solid var(--marca)}
    .ficha.nivel-amarillo{border-top:5px solid var(--amar)}
    .ficha.nivel-rojo{border-top:5px solid var(--rojo)}
    .volver{background:none;border:none;color:var(--verde);font-size:1rem;cursor:pointer;padding:6px 0;font-family:inherit;font-weight:600}
    .ficha-cab{text-align:center;margin:6px 0 4px}
    .emoji-grande{font-size:3.4rem;line-height:1}
    .veredicto{font-family:var(--display);font-weight:700;margin:.2em 0;font-size:1.35rem}
    .veredicto.nivel-verde{color:var(--verde)}
    .veredicto.nivel-amarillo{color:var(--amar)}
    .veredicto.nivel-rojo{color:var(--rojo)}
    .ficha-cat{font-size:.8rem;color:var(--gris);margin:0}
    .bloque{border-top:1px solid var(--linea);padding:12px 0}
    .bloque h4{margin:0 0 5px;font-size:.72rem;text-transform:uppercase;color:var(--gris);letter-spacing:.07em;font-weight:700}
    .bloque p{margin:0}
    .bloque ul{margin:.2em 0;padding-left:1.2em}
    .pill{display:inline-block;background:var(--sup-2);color:var(--txt);border-radius:7px;padding:3px 9px;margin:2px 4px 2px 0;font-size:.85rem}
    .fuente{font-size:.75rem;color:var(--gris);margin-top:14px;border-top:1px dashed var(--linea);padding-top:10px}
    footer{margin-top:28px;font-size:.72rem;color:var(--gris);text-align:center}
    #test-output{font-family:monospace;font-size:13px;padding:16px;max-width:760px;margin:0 auto}
    @media(max-width:360px){.grid{grid-template-columns:1fr 1fr}}

    /* ---- Fase 2 (reintroducción) ---- */
    .tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:2px solid var(--linea)}
    .tab{flex:1;background:none;border:none;padding:12px 8px;font-size:1rem;font-family:inherit;
      color:var(--gris);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .15s}
    .tab.activo{color:var(--verde);font-weight:700;border-bottom-color:var(--marca)}
    .intro{font-size:.9rem;color:var(--gris);margin:4px 0 12px}
    .reto-card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--linea);
      border-radius:var(--radio);padding:14px;background:var(--sup);cursor:pointer;font-family:inherit;font-size:1rem;
      margin-bottom:10px;color:var(--txt);box-shadow:var(--sombra);transition:transform .12s ease,box-shadow .15s ease}
    .reto-card:active{transform:scale(.98)}
    .reto-card .reto-info{display:flex;flex-direction:column;gap:2px}
    .reto-card .reto-grupo{font-weight:600}
    .reto-card .reto-sub{font-size:.78rem;color:var(--gris)}
    .estado{margin-left:auto;font-size:.74rem;padding:3px 9px;border-radius:999px;background:var(--sup-2);color:var(--gris);white-space:nowrap}
    .estado.encurso{background:var(--amar-bg);color:var(--amar)}
    .estado.hecho{background:var(--verde-bg);color:var(--verde)}
    .dosis{border:1px solid var(--linea);border-radius:var(--radio);padding:13px;margin:12px 0;background:var(--sup);box-shadow:var(--sombra)}
    .dosis.guardado{border-color:var(--verde-borde);background:var(--verde-bg)}
    .dosis h4{margin:0 0 2px}
    .dosis .fecha{font-size:.8rem;color:var(--gris);margin:0 0 8px}
    .slider-row{margin:12px 0}
    .slider-row label{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:2px}
    .slider-row input[type=range]{width:100%;accent-color:var(--marca)}
    .sval{font-weight:700;color:var(--txt)}
    .btn{display:inline-block;background:var(--marca);color:var(--on-marca);border:none;border-radius:11px;
      padding:11px 16px;font-size:1rem;font-family:inherit;font-weight:600;cursor:pointer;
      box-shadow:var(--sombra);transition:background .15s,transform .1s}
    .btn:hover{background:var(--marca-d)}
    .btn:active{transform:translateY(1px)}
    .btn.sec{background:var(--sup);color:var(--verde);border:1px solid var(--marca)}
    .btn.peligro{background:var(--sup);color:var(--rojo);border:1px solid var(--rojo)}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
    textarea.notas{width:100%;border:1px solid var(--linea);border-radius:10px;padding:9px;
      font-family:inherit;font-size:.95rem;resize:vertical;min-height:48px;margin-top:4px;background:var(--sup);color:var(--txt)}
    .lavado{background:var(--amar-bg);border:1px solid var(--amar-borde);border-radius:10px;padding:10px;font-size:.85rem;margin:14px 0}
    select.alim{width:100%;padding:11px;border:2px solid var(--linea);border-radius:11px;
      font-size:1rem;font-family:inherit;background:var(--sup);color:var(--txt);margin:6px 0}
    .aviso-guardado{font-size:.78rem;color:var(--verde);margin:6px 0 0;font-weight:600}
    .resumen-grupo{border:1px solid var(--linea);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--sup);box-shadow:var(--sombra)}
    .resumen-grupo h3{margin:0 0 2px;font-size:1rem}
    .resumen-grupo table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}
    .resumen-grupo th,.resumen-grupo td{border:1px solid var(--linea);padding:5px 6px;text-align:center}
    .resumen-grupo th{background:var(--sup-2);font-weight:600}
  </style>

  /* ============================================================
     UTILIDADES PURAS
     ============================================================ */
  var NIVELES = ["verde", "amarillo", "rojo"];
  var FODMAPS_VALIDOS = ["Fructosa","Lactosa","Manitol","Sorbitol","GOS","Fructanos"];

  function normalizar(texto) {
    if (typeof texto !== "string") return "";
    return texto
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "") // quita diacríticos (tildes)
      .toLowerCase()
      .trim();
  }

  function validarAlimento(a) {
    var errores = [];
    if (!a || typeof a !== "object") return ["no es un objeto"];
    if (!a.nombre || typeof a.nombre !== "string") errores.push("nombre ausente");
    if (NIVELES.indexOf(a.nivel) === -1) errores.push("nivel inválido: " + a.nivel);
    if (typeof a.categoria !== "string" || !a.categoria) errores.push("categoria ausente");
    if (!Array.isArray(a.sinonimos)) errores.push("sinonimos debe ser array");
    if (!Array.isArray(a.fodmap)) errores.push("fodmap debe ser array");
    if (!Array.isArray(a.alternativas)) errores.push("alternativas debe ser array");
    if (typeof a.racion_segura !== "string" || !a.racion_segura) errores.push("racion_segura ausente");
    if (typeof a.consejo !== "string") errores.push("consejo debe ser texto");
    if (!a.fuente) errores.push("fuente ausente (trazabilidad)");
    if ((a.nivel === "rojo" || a.nivel === "amarillo") &&
        Array.isArray(a.fodmap) && a.fodmap.length === 0 && !a.motivo) {
      errores.push("nivel " + a.nivel + " sin FODMAP ni motivo declarado");
    }
    if (Array.isArray(a.fodmap)) {
      a.fodmap.forEach(function (f) {
        if (FODMAPS_VALIDOS.indexOf(f) === -1) errores.push("FODMAP desconocido: " + f);
      });
    }
    return errores;
  }

  function buscar(texto, lista, categoria, soloSeguros) {
    var q = normalizar(texto);
    return lista.filter(function (a) {
      if (categoria && a.categoria !== categoria) return false;
      if (soloSeguros && a.nivel !== "verde") return false;
      if (!q) return true;
      if (normalizar(a.nombre).indexOf(q) !== -1) return true;
      return (a.sinonimos || []).some(function (s) {
        return normalizar(s).indexOf(q) !== -1;
      });
    });
  }

  /* ============================================================
     RENDER / UI
     ============================================================ */
  function emojiNivel(n) {
    return n === "verde" ? "🟢" : n === "amarillo" ? "🟡" : n === "rojo" ? "🔴" : "⚪";
  }
  function textoNivel(n) {
    return n === "verde" ? "Puedes comerlo"
         : n === "amarillo" ? "Con cuidado: depende de la cantidad"
         : n === "rojo" ? "Evítalo en fase 1" : "Sin datos";
  }
  function escapeHTML(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  var estado = { texto: "", categoria: null, soloSeguros: false };

  function tarjetaHTML(a) {
    return '<button class="card nivel-' + a.nivel + '" data-nombre="' +
      escapeHTML(a.nombre) + '">' +
      '<span class="emoji">' + emojiNivel(a.nivel) + '</span>' +
      '<span class="card-nombre">' + escapeHTML(a.nombre) + '</span>' +
      '<span class="card-cat">' + escapeHTML(a.categoria) + '</span></button>';
  }

  function fichaHTML(a) {
    var fod = a.fodmap.length
      ? '<div class="bloque"><h4>FODMAP responsable</h4><p>' +
        a.fodmap.map(function (f) { return '<span class="pill">' + escapeHTML(f) + '</span>'; }).join("") +
        "</p></div>"
      : (a.motivo
        ? '<div class="bloque"><h4>Motivo del límite</h4><p>' + escapeHTML(a.motivo) + "</p></div>"
        : "");
    var alts = a.alternativas.length
      ? '<div class="bloque"><h4>Alternativas seguras</h4><ul>' +
        a.alternativas.map(function (x) { return "<li>" + escapeHTML(x) + "</li>"; }).join("") +
        "</ul></div>" : "";
    var cons = a.consejo
      ? '<div class="bloque"><h4>Consejo</h4><p>' + escapeHTML(a.consejo) + "</p></div>" : "";
    return '<div class="ficha nivel-' + a.nivel + '">' +
      '<button class="volver" data-volver="1">‹ Volver a la búsqueda</button>' +
      '<div class="ficha-cab"><div class="emoji-grande">' + emojiNivel(a.nivel) + '</div>' +
      '<h2>' + escapeHTML(a.nombre) + '</h2>' +
      '<p class="veredicto nivel-' + a.nivel + '">' + textoNivel(a.nivel) + '</p>' +
      '<p class="ficha-cat">' + escapeHTML(a.categoria) + '</p></div>' +
      '<div class="bloque"><h4>Ración orientativa</h4><p>' + escapeHTML(a.racion_segura) + '</p></div>' +
      fod + alts + cons +
      '<p class="fuente">Fuente: ' + escapeHTML(a.fuente) +
      '. Información orientativa; no sustituye a tu dietista.</p></div>';
  }

  function render() {
    var app = document.getElementById("vista");
    if (!app) return;
    var resultados = buscar(estado.texto, DATOS, estado.categoria, estado.soloSeguros);
    var chips = CATEGORIAS.map(function (c) {
      return '<button class="chip' + (estado.categoria === c ? " activo" : "") +
        '" data-cat="' + escapeHTML(c) + '">' + escapeHTML(c) + "</button>";
    }).join("");
    var lista = resultados.length
      ? '<div class="grid">' + resultados.map(tarjetaHTML).join("") + "</div>"
      : '<p class="vacio">No se ha encontrado nada.<br>Prueba con otro nombre o revisa por categoría.</p>';
    app.innerHTML =
      '<header><h1>🍽️ ¿Puedo comerlo?</h1>' +
      '<p class="aviso">Guía orientativa para el SII (dieta baja en FODMAP, fase 1). ' +
      'No sustituye el consejo de tu dietista. Las cantidades dependen de cada persona.<br>' +
      '⚠️ <strong>Acumulación (stacking):</strong> juntar varios alimentos "verdes" en una misma comida puede dar síntomas. ' +
      'Con la fruta: 1 porción por comida, separadas ≥3 h y máx. 2 al día.</p></header>' +
      '<input id="q" type="search" inputmode="search" placeholder="Busca un alimento… (ej. cebolla)" ' +
      'value="' + escapeHTML(estado.texto) + '" autocomplete="off" autocapitalize="off">' +
      '<label class="seguros"><input type="checkbox" id="soloSeguros"' +
      (estado.soloSeguros ? " checked" : "") + '> Mostrar solo seguros 🟢</label>' +
      '<div class="chips"><button class="chip' + (estado.categoria === null ? " activo" : "") +
      '" data-cat="">Todas</button>' + chips + "</div>" +
      '<p class="conteo">' + resultados.length + ' alimento' + (resultados.length === 1 ? "" : "s") + '</p>' +
      '<div id="contenido">' + lista + "</div>" +
      '<footer>Datos contrastados con tu guía clínica (NotebookLM: AEG/SEEN) y con Monash FODMAP. ' +
      'Criterio: ante discrepancia entre fuentes se aplica la opción <strong>más prudente</strong>. ' +
      'En cada alimento puedes ver su fuente. Revisa siempre la etiqueta de los productos procesados.</footer>';
    enlazarEventos();
  }

  function mostrarFicha(nombre) {
    var a = DATOS.filter(function (x) { return x.nombre === nombre; })[0];
    if (!a) return;
    var cont = document.getElementById("contenido");
    if (!cont) return;
    cont.innerHTML = fichaHTML(a);
    var v = document.querySelector("[data-volver]");
    if (v) v.addEventListener("click", function () {
      render();
      window.scrollTo(0, 0);
    });
    window.scrollTo(0, 0);
  }

  function enlazarEventos() {
    var q = document.getElementById("q");
    if (q) q.addEventListener("input", function (e) {
      estado.texto = e.target.value;
      render();
      enfocarBusqueda();
    });
    var s = document.getElementById("soloSeguros");
    if (s) s.addEventListener("change", function (e) {
      estado.soloSeguros = e.target.checked;
      render();
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-cat]"), function (b) {
      b.addEventListener("click", function () {
        estado.categoria = b.getAttribute("data-cat") || null;
        render();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-nombre]"), function (b) {
      b.addEventListener("click", function () {
        mostrarFicha(b.getAttribute("data-nombre"));
      });
    });
  }

  function enfocarBusqueda() {
    var q = document.getElementById("q");
    if (q) {
      var v = q.value;
      q.focus();
      try { q.setSelectionRange(v.length, v.length); } catch (e) {}
    }
  }

  /* ============================================================
     NAVEGACIÓN (pestañas Buscador / Reintroducción)
     ============================================================ */
  var vistaActual = "buscador"; // "buscador" | "fase2"

  function renderApp() {
    var app = document.getElementById("app");
    if (!app) return;
    app.innerHTML =
      '<div class="tabs">' +
      '<button class="tab' + (vistaActual === "buscador" ? " activo" : "") + '" data-tab="buscador">🔍 Buscador</button>' +
      '<button class="tab' + (vistaActual === "fase2" ? " activo" : "") + '" data-tab="fase2">🔄 Reintroducción</button>' +
      '</div><div id="vista"></div>';
    Array.prototype.forEach.call(app.querySelectorAll("[data-tab]"), function (b) {
      b.addEventListener("click", function () { navegar(b.getAttribute("data-tab")); });
    });
    if (vistaActual === "fase2") renderFase2();
    else render();
  }

  function navegar(tab) {
    vistaActual = tab;
    renderApp();
    window.scrollTo(0, 0);
  }

  /* ============================================================
     FASE 2 · DATOS (retos de reintroducción)
     agenda: "seguida" (días 1-2-3) | "alterna" (días 1-3-5, para fructanos y GOS)
     ============================================================ */
  var RETOS = [
    { id:"fructosa", grupo:"Fructosa", agenda:"seguida", fodmap:"Fructosa",
      nota:"La miel contiene solo fructosa, por eso es ideal para probar este grupo.",
      alimentos:[
        { nombre:"Miel", sugerido:true, dosis:["1 cucharadita","2 cucharaditas","1 cucharada"] },
        { nombre:"Mango", sugerido:false, dosis:["1/4 de pieza","1/2 pieza","1 pieza pequeña"] },
        { nombre:"Zumo de naranja", sugerido:false, dosis:["1/2 vaso (125 ml)","3/4 de vaso","1 vaso (250 ml)"] }
      ] },
    { id:"lactosa", grupo:"Lactosa", agenda:"seguida", fodmap:"Lactosa",
      nota:"La leche normal es el clásico alimento de prueba para la lactosa.",
      alimentos:[
        { nombre:"Leche normal", sugerido:true, dosis:["1/4 vaso (60 ml)","1/2 vaso (125 ml)","1 vaso (250 ml)"] },
        { nombre:"Yogur natural normal", sugerido:false, dosis:["1/4 tarrina","1/2 tarrina","1 tarrina (125 g)"] }
      ] },
    { id:"sorbitol", grupo:"Sorbitol", agenda:"seguida", fodmap:"Sorbitol",
      nota:"Para el sorbitol puedes usar aguacate (lo recomienda tu guía clínica) o moras. Elige el alimento que estés reintroduciendo.",
      alimentos:[
        { nombre:"Aguacate", sugerido:true, dosis:["1/8 de pieza","1/4 de pieza","1/2 pieza"],
          nota:"Tu guía clínica recomienda el aguacate para probar el sorbitol. Nota: Monash lo retiró como prueba estándar porque también contiene perseitol (otro poliol); ambos criterios son válidos, coméntalo con tu dietista." },
        { nombre:"Moras / zarzamoras", sugerido:false, dosis:["5 moras","10 moras","20 moras"] },
        { nombre:"Albaricoque", sugerido:false, dosis:["1/2 unidad","1 unidad","2 unidades"] }
      ] },
    { id:"manitol", grupo:"Manitol", agenda:"seguida", fodmap:"Manitol",
      nota:"El champiñón es rico en manitol y bajo en otros FODMAPs.",
      alimentos:[
        { nombre:"Champiñón", sugerido:true, dosis:["1/2 champiñón","1 champiñón","3 champiñones"] },
        { nombre:"Coliflor", sugerido:false, dosis:["1/4 taza","1/2 taza","1 taza"] },
        { nombre:"Setas Portobello", sugerido:false, dosis:["1/2 seta","1 seta","2 setas"] }
      ] },
    { id:"fructanos-trigo", grupo:"Fructanos (trigo)", agenda:"alterna", fodmap:"Fructanos",
      nota:"Prueba los fructanos del trigo por separado de los de la verdura: se toleran distinto.",
      alimentos:[
        { nombre:"Pan de trigo", sugerido:true, dosis:["1/2 rebanada","1 rebanada","2 rebanadas"] },
        { nombre:"Pasta de trigo", sugerido:false, dosis:["1/4 taza cocida","1/2 taza cocida","1 taza cocida"] }
      ] },
    { id:"fructanos-verdura", grupo:"Fructanos (verdura)", agenda:"alterna", fodmap:"Fructanos",
      nota:"La cebolla es uno de los fructanos más potentes; pruébala aparte del trigo.",
      alimentos:[
        { nombre:"Cebolla", sugerido:true, dosis:["1 cucharadita cruda","1 cucharada cruda","1/4 de cebolla"] },
        { nombre:"Ajo", sugerido:false, dosis:["1/4 de diente","1/2 diente","1 diente"] }
      ] },
    { id:"gos", grupo:"GOS (galactanos)", agenda:"alterna", fodmap:"GOS",
      nota:"Los garbanzos aportan GOS. De bote y enjuagados son el alimento de prueba habitual.",
      alimentos:[
        { nombre:"Garbanzos de bote", sugerido:true, dosis:["1/4 taza","1/2 taza","3/4 taza"] },
        { nombre:"Lentejas de bote", sugerido:false, dosis:["1/4 taza","1/2 taza","3/4 taza"] },
        { nombre:"Almendras", sugerido:false, dosis:["10 unidades","15 unidades","20 unidades"] }
      ] }
  ];

  /* ============================================================
     FASE 2 · LÓGICA PURA (agenda, validación, persistencia)
     ============================================================ */
  function validarReto(r) {
    var e = [];
    if (!r || typeof r !== "object") return ["no es objeto"];
    if (!r.id) e.push("id ausente");
    if (!r.grupo) e.push("grupo ausente");
    if (["seguida", "alterna"].indexOf(r.agenda) === -1) e.push("agenda inválida");
    if (FODMAPS_VALIDOS.indexOf(r.fodmap) === -1) e.push("fodmap inválido: " + r.fodmap);
    if (!Array.isArray(r.alimentos) || !r.alimentos.length) { e.push("sin alimentos"); return e; }
    var sug = r.alimentos.filter(function (a) { return a.sugerido; });
    if (sug.length !== 1) e.push("debe haber exactamente 1 sugerido");
    r.alimentos.forEach(function (a) {
      if (!a.nombre) e.push("alimento sin nombre");
      if (!Array.isArray(a.dosis) || a.dosis.length !== 3) e.push((a.nombre || "?") + ": dosis debe tener 3");
    });
    return e;
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function aISO(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }

  function calcularFechas(inicioISO, agenda) {
    var partes = String(inicioISO).split("-");
    if (partes.length !== 3) return [];
    var base = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]));
    if (isNaN(base.getTime())) return [];
    var paso = agenda === "alterna" ? 2 : 1;
    var fechas = [];
    for (var i = 0; i < 3; i++) {
      var d = new Date(base.getTime());
      d.setDate(base.getDate() + i * paso);
      fechas.push(aISO(d));
    }
    return fechas;
  }

  var STORAGE_KEY = "sii_fodmap_fase2_v1";
  var almacen = {
    _mem: null,
    disponible: function () {
      try {
        localStorage.setItem("__t", "1");
        localStorage.removeItem("__t");
        return true;
      } catch (e) { return false; }
    },
    cargar: function () {
      if (this._mem) return this._mem;
      var base = { version: 1, retos: {} };
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          var p = JSON.parse(raw);
          if (p && p.retos && typeof p.retos === "object") base = p;
        }
      } catch (e) {}
      this._mem = base;
      return base;
    },
    guardar: function (data) {
      this._mem = data;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; }
      catch (e) { return false; }
    },
    exportar: function () { return JSON.stringify(this.cargar(), null, 2); },
    importar: function (json) {
      var p;
      try { p = JSON.parse(json); } catch (e) { return false; }
      if (!p || typeof p !== "object" || !p.retos || typeof p.retos !== "object") return false;
      this.guardar({ version: p.version || 1, retos: p.retos });
      return true;
    }
  };

  function progresoDe(id) {
    var data = almacen.cargar();
    return data.retos[id] || null;
  }

  function iniciarReto(id, alimentoNombre, fechaInicio, dosisCustom) {
    var reto = RETOS.filter(function (r) { return r.id === id; })[0];
    if (!reto) return;
    var esCustom = Array.isArray(dosisCustom) && dosisCustom.length === 3;
    var nombre, dosis;
    if (esCustom) {
      nombre = (alimentoNombre || "Mi alimento");
      dosis = dosisCustom;
    } else {
      var alimento = reto.alimentos.filter(function (a) { return a.nombre === alimentoNombre; })[0] || reto.alimentos[0];
      nombre = alimento.nombre;
      dosis = alimento.dosis;
    }
    var fechas = calcularFechas(fechaInicio, reto.agenda);
    var data = almacen.cargar();
    data.retos[id] = {
      alimentoElegido: nombre,
      personalizado: esCustom,
      fechaInicio: fechaInicio,
      dias: dosis.map(function (d, i) {
        return { etiqueta: "Dosis " + (i + 1), dosis: d, fecha: fechas[i] || "",
          dolor: 0, hinchazon: 0, gases: 0, notas: "", guardado: false };
      })
    };
    almacen.guardar(data);
  }

  function guardarDia(id, idx, valores) {
    var data = almacen.cargar();
    var r = data.retos[id];
    if (!r || !r.dias[idx]) return;
    r.dias[idx].dolor = valores.dolor;
    r.dias[idx].hinchazon = valores.hinchazon;
    r.dias[idx].gases = valores.gases;
    r.dias[idx].notas = valores.notas;
    r.dias[idx].guardado = true;
    almacen.guardar(data);
  }

  function reiniciarReto(id) {
    var data = almacen.cargar();
    delete data.retos[id];
    almacen.guardar(data);
  }

  function estadoReto(id) {
    var r = progresoDe(id);
    if (!r) return "sin-iniciar";
    return r.dias.every(function (d) { return d.guardado; }) ? "hecho" : "encurso";
  }

  /* ============================================================
     FASE 3 · DATOS Y LÓGICA (personalización / tolerancias)
     estado ∈ "sin_probar" | "tolera" | "limite" | "no"
     ============================================================ */
  var STORAGE_KEY_F3 = "sii_fodmap_fase3_v1";
  var almacenF3 = {
    _mem: null,
    cargar: function () {
      if (this._mem) return this._mem;
      var base = { version: 1, tolerancias: {}, verSegunTolerancia: false };
      try {
        var raw = localStorage.getItem(STORAGE_KEY_F3);
        if (raw) {
          var p = JSON.parse(raw);
          if (p && p.tolerancias && typeof p.tolerancias === "object") {
            base = { version: p.version || 1, tolerancias: p.tolerancias,
                     verSegunTolerancia: !!p.verSegunTolerancia };
          }
        }
      } catch (e) {}
      this._mem = base;
      return base;
    },
    guardar: function (data) {
      this._mem = data;
      try { localStorage.setItem(STORAGE_KEY_F3, JSON.stringify(data)); return true; }
      catch (e) { return false; }
    }
  };

  function toleranciaDe(id) {
    var t = almacenF3.cargar().tolerancias[id];
    return t || { estado: "sin_probar", limiteDosis: null };
  }

  function setTolerancia(id, estado, limiteDosis) {
    var data = almacenF3.cargar();
    if (estado === "sin_probar") {
      delete data.tolerancias[id];
    } else {
      data.tolerancias[id] = {
        estado: estado,
        limiteDosis: estado === "limite" ? (limiteDosis || 1) : null
      };
    }
    almacenF3.guardar(data);
  }

  function setVerSegunTolerancia(v) {
    var data = almacenF3.cargar();
    data.verSegunTolerancia = !!v;
    almacenF3.guardar(data);
  }

  function hayAlgunaTolerancia() {
    var t = almacenF3.cargar().tolerancias;
    return Object.keys(t).some(function (k) {
      return t[k] && t[k].estado && t[k].estado !== "sin_probar";
    });
  }

  // Severidad: tolera (mejor) < limite < no/sin_probar (peor)
  function rangoEstado(e) {
    return e === "tolera" ? 0 : e === "limite" ? 1 : 2;
  }
  function peorEstado(a, b) {
    return rangoEstado(a) >= rangoEstado(b) ? a : b;
  }

  // Estado fase3 ("sin_probar"|"tolera"|"limite"|"no") de un FODMAP de alimento.
  // "Fructanos" toma el más restrictivo de trigo y verdura.
  function estadoFodmap(fodmapNombre, tolerancias) {
    function est(id) { return (tolerancias[id] && tolerancias[id].estado) || "sin_probar"; }
    if (fodmapNombre === "Fructanos") {
      return peorEstado(est("fructanos-trigo"), est("fructanos-verdura"));
    }
    var mapa = { "Fructosa": "fructosa", "Lactosa": "lactosa", "Sorbitol": "sorbitol",
                 "Manitol": "manitol", "GOS": "gos" };
    return est(mapa[fodmapNombre] || "");
  }

  // Nivel personalizado de un alimento dado el mapa de tolerancias.
  // Devuelve { nivel, nota } o null si el alimento NO cambia.
  function nivelPersonalizado(alimento, tolerancias) {
    if (!alimento || !Array.isArray(alimento.fodmap) || alimento.fodmap.length === 0) return null;
    var estados = alimento.fodmap.map(function (f) { return estadoFodmap(f, tolerancias); });
    var hayBloqueante = estados.some(function (e) { return e !== "tolera" && e !== "limite"; });
    if (hayBloqueante) return null;                 // algún FODMAP no tolerado o sin probar
    var hayLimite = estados.some(function (e) { return e === "limite"; });
    if (hayLimite) {
      if (alimento.nivel === "amarillo") return null; // ya es amarillo, no aporta
      return { nivel: "amarillo", nota: "Según tu tolerancia, con moderación." };
    }
    if (alimento.nivel === "verde") return null;      // ya es verde
    return { nivel: "verde", nota: "Según tu tolerancia." };
  }

  /* ============================================================
     FASE 2 · RENDER / UI
     ============================================================ */
  var estadoFase2 = { retoAbierto: null, resumen: false };

  function descargar(nombre, contenido) {
    try {
      var blob = new Blob([contenido], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = nombre;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    } catch (e) { alert("No se pudo exportar: " + e.message); }
  }

  function pedirImportar() {
    var inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "application/json,.json";
    inp.addEventListener("change", function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        if (almacen.importar(fr.result)) { alert("Copia importada correctamente."); renderFase2(); }
        else alert("El archivo no es una copia válida. No se ha cambiado nada.");
      };
      fr.readAsText(f);
    });
    inp.click();
  }

  function wireAcciones(v) {
    Array.prototype.forEach.call(v.querySelectorAll("[data-accion]"), function (b) {
      b.addEventListener("click", function () {
        var a = b.getAttribute("data-accion");
        if (a === "exportar") descargar("diario-fodmap.json", almacen.exportar());
        else if (a === "importar") pedirImportar();
        else if (a === "resumen") { estadoFase2.resumen = true; renderFase2(); window.scrollTo(0, 0); }
      });
    });
    Array.prototype.forEach.call(v.querySelectorAll("[data-volver-f2]"), function (b) {
      b.addEventListener("click", function () {
        estadoFase2.resumen = false; estadoFase2.retoAbierto = null;
        renderFase2(); window.scrollTo(0, 0);
      });
    });
  }

  function renderFase2() {
    var v = document.getElementById("vista");
    if (!v) return;
    if (estadoFase2.resumen) { renderResumen(); return; }
    if (estadoFase2.retoAbierto) { renderReto(estadoFase2.retoAbierto); return; }

    var cards = RETOS.map(function (r) {
      var est = estadoReto(r.id);
      var etiqueta = est === "hecho" ? "Completado" : est === "encurso" ? "En curso" : "Sin empezar";
      var cls = est === "hecho" ? "hecho" : est === "encurso" ? "encurso" : "";
      var alim = (progresoDe(r.id) || {}).alimentoElegido ||
        r.alimentos.filter(function (a) { return a.sugerido; })[0].nombre;
      return '<button class="reto-card" data-reto="' + escapeHTML(r.id) + '">' +
        '<div class="reto-info"><span class="reto-grupo">' + escapeHTML(r.grupo) + '</span>' +
        '<span class="reto-sub">Prueba: ' + escapeHTML(alim) + ' · ' +
        (r.agenda === "alterna" ? "días alternos" : "3 días seguidos") + '</span></div>' +
        '<span class="estado ' + cls + '">' + etiqueta + '</span></button>';
    }).join("");

    v.innerHTML =
      '<header><h1>🔄 Reintroducción</h1>' +
      '<p class="aviso">Fase 2: prueba un grupo FODMAP cada vez en 3 dosis crecientes y registra tus síntomas. ' +
      'La app <strong>solo registra</strong>; la interpretación la haces con tu dietista.</p></header>' +
      '<p class="intro">Elige un grupo para empezar. Entre un grupo y el siguiente, deja 2-3 días de descanso ' +
      '(dieta baja en FODMAP) hasta que se calmen los síntomas.</p>' +
      cards +
      '<div class="btn-row">' +
        '<button class="btn sec" data-accion="resumen">📋 Ver resumen</button>' +
        '<button class="btn sec" data-accion="exportar">⬇️ Exportar copia</button>' +
        '<button class="btn sec" data-accion="importar">⬆️ Importar copia</button>' +
      '</div>' +
      (almacen.disponible() ? '' :
        '<p class="aviso">⚠️ Tu navegador no permite guardar automáticamente. Usa "Exportar copia" para no perder los datos.</p>') +
      '<footer>Protocolo orientativo basado en Monash FODMAP. No sustituye a tu dietista.</footer>';

    Array.prototype.forEach.call(v.querySelectorAll("[data-reto]"), function (b) {
      b.addEventListener("click", function () {
        estadoFase2.retoAbierto = b.getAttribute("data-reto");
        renderFase2(); window.scrollTo(0, 0);
      });
    });
    wireAcciones(v);
  }

  function bloqueDosisHTML(id, i, d) {
    function slider(clave, label, val) {
      return '<div class="slider-row"><label>' + label +
        ' <span class="sval" data-sval="' + clave + '-' + i + '">' + val + '</span></label>' +
        '<input type="range" min="0" max="10" value="' + val +
        '" data-slider="' + clave + '" data-idx="' + i + '"></div>';
    }
    return '<div class="dosis' + (d.guardado ? " guardado" : "") + '">' +
      '<h4>' + escapeHTML(d.etiqueta) + ': ' + escapeHTML(d.dosis) + '</h4>' +
      '<p class="fecha">📅 ' + escapeHTML(d.fecha || "sin fecha") + (d.guardado ? ' · ✅ guardado' : '') + '</p>' +
      slider("dolor", "Dolor", d.dolor) +
      slider("hinchazon", "Hinchazón", d.hinchazon) +
      slider("gases", "Gases", d.gases) +
      '<textarea class="notas" data-notas="' + i + '" placeholder="Notas (opcional): cuándo, cómo de fuerte…">' +
      escapeHTML(d.notas || "") + '</textarea>' +
      '<div class="btn-row"><button class="btn" data-guardar="' + i + '">Guardar ' + escapeHTML(d.etiqueta) + '</button></div>' +
      '</div>';
  }

  function renderReto(id) {
    var v = document.getElementById("vista");
    if (!v) return;
    var reto = RETOS.filter(function (r) { return r.id === id; })[0];
    if (!reto) { estadoFase2.retoAbierto = null; renderFase2(); return; }
    var prog = progresoDe(id);
    var cuerpo;

    if (!prog) {
      var opciones = reto.alimentos.map(function (a) {
        return '<option value="' + escapeHTML(a.nombre) + '"' + (a.sugerido ? " selected" : "") + '>' +
          escapeHTML(a.nombre) + (a.sugerido ? " (recomendado)" : "") +
          ' — ' + escapeHTML(a.dosis.join(" / ")) + '</option>';
      }).join("");
      opciones += '<option value="__custom__">✏️ Otro alimento (lo escribo yo)…</option>';
      var hoy = aISO(new Date());
      cuerpo =
        '<p class="intro">' + escapeHTML(reto.nota) + '</p>' +
        '<label>Alimento de prueba' +
        '<select class="alim" id="alimSel">' + opciones + '</select></label>' +
        '<div id="notaAlim"></div>' +
        '<div id="customWrap" hidden>' +
          '<label>Nombre de tu alimento' +
          '<input type="text" id="customNombre" class="alim" placeholder="ej. Aguacate" autocomplete="off"></label>' +
          '<label>Dosis 1 (pequeña)' +
          '<input type="text" id="customD0" class="alim" placeholder="ej. 1/2 tostada" autocomplete="off"></label>' +
          '<label>Dosis 2 (media)' +
          '<input type="text" id="customD1" class="alim" placeholder="ej. 1 tostada" autocomplete="off"></label>' +
          '<label>Dosis 3 (grande)' +
          '<input type="text" id="customD2" class="alim" placeholder="ej. 2 tostadas" autocomplete="off"></label>' +
          '<p class="reto-sub">Pon las 3 cantidades crecientes que te haya indicado tu dietista.</p>' +
        '</div>' +
        '<label>Fecha de la primera dosis' +
        '<input type="date" id="fechaSel" class="alim" value="' + hoy + '"></label>' +
        '<div class="btn-row"><button class="btn" data-empezar="1">Empezar reto</button></div>' +
        '<div class="lavado">' + (reto.agenda === "alterna"
          ? "Este grupo se prueba en <strong>días alternos</strong> (día 1, 3 y 5): los síntomas de fructanos/GOS pueden tardar hasta 48 h."
          : "Este grupo se prueba en <strong>3 días seguidos</strong> con dosis crecientes.") + '</div>';
    } else {
      var dias = prog.dias.map(function (d, i) { return bloqueDosisHTML(id, i, d); }).join("");
      var alElegido = reto.alimentos.filter(function (a) { return a.nombre === prog.alimentoElegido; })[0];
      var notaAl = (alElegido && alElegido.nota)
        ? '<div class="lavado">ℹ️ ' + escapeHTML(alElegido.nota) + '</div>' : "";
      cuerpo =
        '<p class="intro">Alimento: <strong>' + escapeHTML(prog.alimentoElegido) + '</strong>' +
        (prog.personalizado ? ' (personalizado)' : '') + '. ' +
        escapeHTML(reto.nota) + '</p>' +
        notaAl +
        dias +
        '<div class="lavado">Tras la última dosis, vuelve a dieta baja en FODMAP <strong>2-3 días</strong> ' +
        '(hasta que se calmen los síntomas) antes de probar el siguiente grupo.</div>' +
        '<div class="btn-row"><button class="btn peligro" data-reiniciar="' + escapeHTML(id) + '">Reiniciar este reto</button></div>';
    }

    v.innerHTML =
      '<button class="volver" data-volver-f2="1">‹ Volver a los grupos</button>' +
      '<div class="ficha-cab"><h2>' + escapeHTML(reto.grupo) + '</h2>' +
      '<p class="ficha-cat">FODMAP: ' + escapeHTML(reto.fodmap) + '</p></div>' +
      cuerpo;

    var sel = document.getElementById("alimSel");
    if (sel) {
      var actualizarSel = function () {
        var wrap = document.getElementById("customWrap");
        var notaDiv = document.getElementById("notaAlim");
        if (sel.value === "__custom__") {
          if (wrap) wrap.hidden = false;
          if (notaDiv) notaDiv.innerHTML = "";
        } else {
          if (wrap) wrap.hidden = true;
          var al = reto.alimentos.filter(function (a) { return a.nombre === sel.value; })[0];
          if (notaDiv) notaDiv.innerHTML = (al && al.nota)
            ? '<div class="lavado">ℹ️ ' + escapeHTML(al.nota) + '</div>' : "";
        }
      };
      sel.addEventListener("change", actualizarSel);
      actualizarSel();
    }

    var emp = v.querySelector("[data-empezar]");
    if (emp) emp.addEventListener("click", function () {
      var selEl = document.getElementById("alimSel");
      var fch = document.getElementById("fechaSel");
      var fecha = (fch && fch.value) ? fch.value : aISO(new Date());
      if (selEl && selEl.value === "__custom__") {
        function val(idc) { var e = document.getElementById(idc); return e ? e.value.trim() : ""; }
        var nombre = val("customNombre");
        if (!nombre) { window.alert("Escribe el nombre de tu alimento."); return; }
        var dosis = [
          val("customD0") || "Dosis pequeña",
          val("customD1") || "Dosis media",
          val("customD2") || "Dosis grande"
        ];
        iniciarReto(id, nombre, fecha, dosis);
      } else {
        var alim = selEl ? selEl.value : reto.alimentos[0].nombre;
        iniciarReto(id, alim, fecha);
      }
      renderFase2(); window.scrollTo(0, 0);
    });

    Array.prototype.forEach.call(v.querySelectorAll("input[data-slider]"), function (s) {
      s.addEventListener("input", function () {
        var span = v.querySelector('[data-sval="' + s.getAttribute("data-slider") + "-" + s.getAttribute("data-idx") + '"]');
        if (span) span.textContent = s.value;
      });
    });

    Array.prototype.forEach.call(v.querySelectorAll("[data-guardar]"), function (b) {
      b.addEventListener("click", function () {
        var idx = Number(b.getAttribute("data-guardar"));
        function valor(clave) {
          var el = v.querySelector('input[data-slider="' + clave + '"][data-idx="' + idx + '"]');
          return el ? Number(el.value) : 0;
        }
        var notasEl = v.querySelector('[data-notas="' + idx + '"]');
        guardarDia(id, idx, {
          dolor: valor("dolor"), hinchazon: valor("hinchazon"), gases: valor("gases"),
          notas: notasEl ? notasEl.value : ""
        });
        renderFase2(); window.scrollTo(0, 0);
      });
    });

    var rei = v.querySelector("[data-reiniciar]");
    if (rei) rei.addEventListener("click", function () {
      if (window.confirm("¿Borrar los datos de este reto y empezar de nuevo?")) {
        reiniciarReto(id);
        renderFase2(); window.scrollTo(0, 0);
      }
    });

    Array.prototype.forEach.call(v.querySelectorAll("[data-volver-f2]"), function (b) {
      b.addEventListener("click", function () {
        estadoFase2.retoAbierto = null; renderFase2(); window.scrollTo(0, 0);
      });
    });
  }

  function renderResumen() {
    var v = document.getElementById("vista");
    if (!v) return;
    var data = almacen.cargar();
    var bloques = RETOS.map(function (r) {
      var p = data.retos[r.id];
      if (!p) return "";
      var filas = p.dias.map(function (d) {
        return '<tr><td>' + escapeHTML(d.etiqueta) + '</td><td>' + escapeHTML(d.dosis) + '</td>' +
          '<td>' + d.dolor + '</td><td>' + d.hinchazon + '</td><td>' + d.gases + '</td></tr>' +
          (d.notas ? '<tr><td colspan="5" style="text-align:left">📝 ' + escapeHTML(d.notas) + '</td></tr>' : '');
      }).join("");
      return '<div class="resumen-grupo"><h3>' + escapeHTML(r.grupo) + '</h3>' +
        '<p class="reto-sub">Alimento: ' + escapeHTML(p.alimentoElegido) + '</p>' +
        '<table><tr><th>Dosis</th><th>Cantidad</th><th>Dolor</th><th>Hinch.</th><th>Gases</th></tr>' +
        filas + '</table></div>';
    }).join("");

    v.innerHTML =
      '<button class="volver" data-volver-f2="1">‹ Volver</button>' +
      '<h2>📋 Resumen para el dietista</h2>' +
      '<p class="intro">Síntomas registrados por dosis (escala 0-10). La app no interpreta los resultados.</p>' +
      (bloques || '<p class="vacio">Aún no has registrado ningún grupo.</p>') +
      '<div class="btn-row"><button class="btn sec" data-accion="exportar">⬇️ Exportar copia</button></div>';
    wireAcciones(v);
  }

  /* ============================================================
     MOTOR DE TESTS  (se ejecuta solo con ?test)
     ============================================================ */
  function runTests() {
    var results = [];
    function assert(cond, msg) { results.push({ ok: !!cond, msg: msg }); }
    try {
      registerTests(assert);
    } catch (e) {
      results.push({ ok: false, msg: "Excepción en tests: " + e.message });
    }
    var passed = results.filter(function (r) { return r.ok; }).length;
    var failed = results.length - passed;
    var out = document.getElementById("test-output");
    out.hidden = false;
    document.getElementById("app").hidden = true;
    out.innerHTML =
      "<h2>" + passed + " ✓ / " + failed + " ✗</h2>" +
      results.map(function (r) {
        return '<div style="color:' + (r.ok ? "green" : "#c62828") + '">' +
          (r.ok ? "✓ " : "✗ ") + escapeHTML(r.msg) + "</div>";
      }).join("");
    results.forEach(function (r) {
      if (!r.ok) console.error("TEST FAIL:", r.msg);
    });
    console.log("Tests: " + passed + " ✓ / " + failed + " ✗");
    return { passed: passed, failed: failed };
  }

  function registerTests(assert) {
    // Motor
    assert(true, "el motor de tests funciona");

    // normalizar()
    assert(normalizar("Plátano") === "platano", "normalizar quita tildes y minúsculas");
    assert(normalizar("  CEBOLLA  ") === "cebolla", "normalizar recorta espacios");
    assert(normalizar("Limón") === "limon", "normalizar ó->o");
    assert(normalizar("") === "", "normalizar cadena vacía");
    assert(normalizar(null) === "", "normalizar null no rompe");

    // validarAlimento()
    var ej = { nombre:"Cebolla", sinonimos:["cebolleta"], categoria:"Verduras",
      nivel:"rojo", racion_segura:"Evitar.", fodmap:["Fructanos"],
      alternativas:["Cebollino"], consejo:"x", fuente:"Monash" };
    assert(validarAlimento(ej).length === 0, "alimento bien formado no da errores");
    assert(validarAlimento({ nombre:"X", categoria:"Verduras", nivel:"morado" }).length > 0, "nivel inválido se detecta");
    var verde = { nombre:"Arroz", sinonimos:[], categoria:"Cereales y pan", nivel:"verde",
      racion_segura:"Sin límite.", fodmap:[], alternativas:[], consejo:"", fuente:"Monash" };
    assert(validarAlimento(verde).length === 0, "verde con fodmap vacío es válido");
    assert(validarAlimento({ nombre:"Ajo", nivel:"rojo", categoria:"Verduras", sinonimos:[],
      racion_segura:"Evitar", fodmap:[], alternativas:[], consejo:"", fuente:"Monash" }).length > 0,
      "rojo sin FODMAP declarado se detecta como incoherencia");

    // buscar()
    var lista = [ej, verde];
    assert(buscar("cebolla", lista, null, false).length === 1, "buscar por nombre");
    assert(buscar("cebolleta", lista, null, false).length === 1, "buscar por sinónimo");
    assert(buscar("CEBOLLA", lista, null, false).length === 1, "buscar ignora mayúsculas");
    assert(buscar("", lista, "Verduras", false).length === 1, "filtra por categoría");
    assert(buscar("", lista, null, true).length === 1, "filtro solo seguros deja solo verdes");
    assert(buscar("nohaytal", lista, null, false).length === 0, "sin resultados devuelve []");

    // Helpers de render
    assert(emojiNivel("verde") === "🟢", "emoji verde");
    assert(emojiNivel("amarillo") === "🟡", "emoji amarillo");
    assert(emojiNivel("rojo") === "🔴", "emoji rojo");
    assert(normalizar(textoNivel("rojo")).indexOf("evita") !== -1, "texto rojo dice evitar");
    assert(escapeHTML("<b>&") === "&lt;b&gt;&amp;", "escapeHTML evita inyección");

    // Integridad global de DATOS
    assert(DATOS.length >= 80, "hay al menos 80 alimentos (hay " + DATOS.length + ")");
    var erroresDatos = [];
    DATOS.forEach(function (a) {
      var e = validarAlimento(a);
      if (e.length) erroresDatos.push((a && a.nombre) + ": " + e.join(", "));
    });
    assert(erroresDatos.length === 0, "todos los alimentos son válidos" +
      (erroresDatos.length ? " — ERRORES: " + erroresDatos.join(" | ") : ""));

    var nombres = DATOS.map(function (a) { return normalizar(a.nombre); });
    var setN = {}; var dup = [];
    nombres.forEach(function (n) { if (setN[n]) dup.push(n); setN[n] = true; });
    assert(dup.length === 0, "no hay nombres duplicados" + (dup.length ? " — " + dup.join(", ") : ""));

    var catMalas = [];
    DATOS.forEach(function (a) {
      if (CATEGORIAS.indexOf(a.categoria) === -1) catMalas.push(a.nombre + " → " + a.categoria);
    });
    assert(catMalas.length === 0, "todas las categorías son válidas" +
      (catMalas.length ? " — " + catMalas.join(", ") : ""));

    // Búsquedas reales de extremo a extremo
    assert(buscar("cebolla", DATOS, null, false).length >= 1, "encuentra cebolla en DATOS");
    assert(buscar("platano", DATOS, null, false).length >= 1, "encuentra plátano sin tilde");
    assert(buscar("pan", DATOS, null, false).length >= 2, "encuentra varios panes");
    assert(buscar("leche", DATOS, null, false).length >= 2, "encuentra leches");

    // ---- FASE 2: definición de retos ----
    assert(RETOS.length >= 6, "hay al menos 6 retos (hay " + RETOS.length + ")");
    var errRetos = [];
    RETOS.forEach(function (r) {
      var e = validarReto(r);
      if (e.length) errRetos.push(r.id + ": " + e.join(", "));
    });
    assert(errRetos.length === 0, "todos los retos son válidos" +
      (errRetos.length ? " — ERRORES: " + errRetos.join(" | ") : ""));
    var idsR = RETOS.map(function (r) { return r.id; });
    var setR = {}; var dupR = [];
    idsR.forEach(function (n) { if (setR[n]) dupR.push(n); setR[n] = true; });
    assert(dupR.length === 0, "no hay ids de reto duplicados");

    // ---- FASE 2: cálculo de fechas ----
    assert(calcularFechas("2026-06-01", "seguida").join(",") === "2026-06-01,2026-06-02,2026-06-03",
      "agenda seguida = días consecutivos");
    assert(calcularFechas("2026-06-01", "alterna").join(",") === "2026-06-01,2026-06-03,2026-06-05",
      "agenda alterna = días 1,3,5");
    assert(calcularFechas("2026-06-30", "seguida").join(",") === "2026-06-30,2026-07-01,2026-07-02",
      "agenda seguida cruza fin de mes");
    assert(calcularFechas("fecha-mala", "seguida").length === 0, "fecha inválida devuelve []");

    // ---- FASE 2: persistencia (en memoria, sin localStorage) ----
    almacen._mem = null;
    var d0 = almacen.cargar();
    assert(d0 && d0.retos && typeof d0.retos === "object", "cargar sin datos da estructura vacía válida");
    iniciarReto("fructosa", "Miel", "2026-06-01");
    var p = progresoDe("fructosa");
    assert(p && p.dias.length === 3, "iniciarReto crea 3 días");
    assert(p.dias[0].dosis === "1 cucharadita", "iniciarReto copia la primera dosis");
    assert(p.dias[2].fecha === "2026-06-03", "iniciarReto calcula fechas seguidas");
    assert(estadoReto("fructosa") === "encurso", "reto recién iniciado está en curso");
    guardarDia("fructosa", 0, { dolor: 3, hinchazon: 5, gases: 2, notas: "leve" });
    assert(progresoDe("fructosa").dias[0].guardado === true, "guardarDia marca guardado");
    assert(progresoDe("fructosa").dias[0].dolor === 3, "guardarDia guarda el valor");
    assert(estadoReto("lactosa") === "sin-iniciar", "reto no iniciado = sin-iniciar");

    // ---- FASE 2: exportar / importar ----
    var exp = almacen.exportar();
    almacen._mem = { version: 1, retos: {} };
    assert(almacen.importar(exp) === true, "importar JSON válido funciona");
    assert(progresoDe("fructosa").dias[0].dolor === 3, "importar restaura los datos");
    var antes = almacen.exportar();
    assert(almacen.importar("{ no es json") === false, "importar JSON inválido devuelve false");
    assert(almacen.importar('{"foo":1}') === false, "importar sin 'retos' devuelve false");
    assert(almacen.exportar() === antes, "un import inválido no pisa los datos");

    // ---- FASE 2: reiniciar ----
    reiniciarReto("fructosa");
    assert(progresoDe("fructosa") === null, "reiniciarReto borra el progreso");

    // ---- FASE 2: alimento personalizado ----
    iniciarReto("sorbitol", "Aguacate de Rocío", "2026-07-01", ["1/2 tostada", "1 tostada", "2 tostadas"]);
    var pc = progresoDe("sorbitol");
    assert(pc && pc.dias.length === 3, "iniciarReto personalizado crea 3 días");
    assert(pc.alimentoElegido === "Aguacate de Rocío", "personalizado usa el nombre escrito");
    assert(pc.dias[1].dosis === "1 tostada", "personalizado usa las dosis escritas");
    assert(pc.personalizado === true, "marca el reto como personalizado");
    reiniciarReto("sorbitol");

    // ---- FASE 2: nuevos alimentos del catálogo ----
    function alimentoEn(idr, nombre) {
      var r = RETOS.filter(function (x) { return x.id === idr; })[0];
      return !!(r && r.alimentos.some(function (a) { return a.nombre === nombre; }));
    }
    assert(alimentoEn("fructosa", "Mango"), "fructosa incluye Mango");
    assert(alimentoEn("fructosa", "Zumo de naranja"), "fructosa incluye Zumo de naranja");
    assert(alimentoEn("sorbitol", "Aguacate"), "sorbitol incluye Aguacate");
    assert(alimentoEn("manitol", "Setas Portobello"), "manitol incluye Setas Portobello");
    var avoc = RETOS.filter(function (r) { return r.id === "sorbitol"; })[0]
      .alimentos.filter(function (a) { return a.nombre === "Aguacate"; })[0];
    assert(avoc && avoc.nota && avoc.nota.length > 0, "el Aguacate lleva nota informativa (perseitol)");

    // ---- FASE 3: persistencia ----
    almacenF3._mem = null;
    var f3 = almacenF3.cargar();
    assert(f3 && f3.tolerancias && typeof f3.tolerancias === "object", "F3 cargar sin datos da estructura vacía válida");
    assert(f3.verSegunTolerancia === false, "F3 verSegunTolerancia por defecto es false");
    assert(toleranciaDe("fructosa").estado === "sin_probar", "tolerancia por defecto es sin_probar");
    setTolerancia("fructosa", "tolera", null);
    assert(toleranciaDe("fructosa").estado === "tolera", "setTolerancia guarda 'tolera'");
    setTolerancia("lactosa", "limite", 2);
    assert(toleranciaDe("lactosa").estado === "limite" && toleranciaDe("lactosa").limiteDosis === 2, "setTolerancia 'limite' guarda la dosis");
    setTolerancia("lactosa", "sin_probar", null);
    assert(toleranciaDe("lactosa").estado === "sin_probar", "marcar sin_probar borra la tolerancia");
    assert(hayAlgunaTolerancia() === true, "hayAlgunaTolerancia detecta una tolerancia guardada");
    setVerSegunTolerancia(true);
    assert(almacenF3.cargar().verSegunTolerancia === true, "setVerSegunTolerancia persiste el toggle");
    almacenF3._mem = { version: 1, tolerancias: {}, verSegunTolerancia: false };
    assert(hayAlgunaTolerancia() === false, "sin tolerancias, hayAlgunaTolerancia es false");

    // ---- FASE 3: lógica de re-coloreado (pura) ----
    assert(peorEstado("tolera", "limite") === "limite", "peorEstado: limite peor que tolera");
    assert(peorEstado("limite", "no") === "no", "peorEstado: no peor que limite");
    assert(peorEstado("tolera", "tolera") === "tolera", "peorEstado: dos tolera = tolera");
    var tolA = { "fructosa": { estado: "tolera" } };
    assert(estadoFodmap("Fructosa", tolA) === "tolera", "estadoFodmap mapea Fructosa->fructosa");
    var tolFr = { "fructanos-trigo": { estado: "tolera" }, "fructanos-verdura": { estado: "limite" } };
    assert(estadoFodmap("Fructanos", tolFr) === "limite", "estadoFodmap Fructanos usa el más restrictivo");
    assert(estadoFodmap("Fructanos", {}) === "sin_probar", "estadoFodmap Fructanos sin datos = sin_probar");

    var cebolla = { nombre: "Cebolla", nivel: "rojo", fodmap: ["Fructanos"] };
    assert(nivelPersonalizado(cebolla, {}) === null, "sin tolerancia no se re-colorea");
    assert(nivelPersonalizado(cebolla, { "fructanos-trigo": { estado: "tolera" }, "fructanos-verdura": { estado: "tolera" } }).nivel === "verde",
      "cebolla->verde si tolera ambos fructanos");
    assert(nivelPersonalizado(cebolla, { "fructanos-trigo": { estado: "tolera" }, "fructanos-verdura": { estado: "limite" } }).nivel === "amarillo",
      "cebolla->amarillo si un fructano es 'con límite'");
    assert(nivelPersonalizado(cebolla, { "fructanos-trigo": { estado: "tolera" } }) === null,
      "cebolla no cambia si el otro fructano está sin probar");
    var guisante = { nombre: "Guisantes", nivel: "rojo", fodmap: ["GOS", "Fructanos"] };
    assert(nivelPersonalizado(guisante, { "gos": { estado: "tolera" }, "fructanos-trigo": { estado: "tolera" }, "fructanos-verdura": { estado: "tolera" } }).nivel === "verde",
      "multi-FODMAP mejora solo si todos tolerados");
    assert(nivelPersonalizado(guisante, { "gos": { estado: "tolera" } }) === null,
      "multi-FODMAP no mejora si falta uno");
    var arroz = { nombre: "Arroz", nivel: "verde", fodmap: [] };
    assert(nivelPersonalizado(arroz, { "fructosa": { estado: "tolera" } }) === null, "alimento sin FODMAP no cambia");
    var ciruela = { nombre: "Ciruela", nivel: "rojo", fodmap: [], motivo: "carga total" };
    assert(nivelPersonalizado(ciruela, { "fructosa": { estado: "tolera" } }) === null, "alimento por 'motivo' (sin FODMAP) nunca cambia");
    var tomate = { nombre: "Tomate", nivel: "amarillo", fodmap: ["Fructosa"] };
    assert(nivelPersonalizado(tomate, { "fructosa": { estado: "tolera" } }).nivel === "verde", "amarillo->verde si tolera su único FODMAP");
    assert(nivelPersonalizado(tomate, { "fructosa": { estado: "limite" } }) === null, "amarillo con límite no cambia (ya es amarillo)");

    almacenF3._mem = null;                    // dejar limpio
    almacen._mem = { version: 1, retos: {} }; // dejar limpio
  }

  /* ============================================================
     ARRANQUE
     ============================================================ */
  function init() {
    if (location.search.indexOf("test") !== -1) {
      runTests();
      return;
    }
    renderApp();
  }

  document.addEventListener("DOMContentLoaded", init);
  </script>

<div id="update-banner" style="display:none; position:fixed; bottom:0; left:0; right:0; background:#2F8F6B; color:#fff; padding:12px 16px; align-items:center; justify-content:space-between; z-index:9999; font-family:'Hanken Grotesk',system-ui,sans-serif; box-shadow:0 -2px 12px rgba(0,0,0,.18);">
  <div>
    <strong>🔄 Nueva versión disponible</strong><br>
    <small>Tus datos NO se perderán al actualizar.</small>
  </div>
  <button id="update-btn" style="background:#fff; color:#27795A; border:none; padding:8px 16px; border-radius:8px; font-weight:bold; cursor:pointer;">Actualizar ahora</button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    let pendingSW = null;

    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const newSW = reg.installing;
        newSW.addEventListener('statechange', () => {
          if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
            pendingSW = newSW;
            document.getElementById('update-banner').style.display = 'flex';
          }
        });
      });
    }).catch(err => console.warn('[SW] Registro fallido:', err));

    navigator.serviceWorker.addEventListener('message', event => {
      if (event.data && event.data.type === 'SW_ACTIVATED') {
        window.location.reload();
      }
    });

    document.getElementById('update-btn').addEventListener('click', () => {
      if (pendingSW) {
        pendingSW.postMessage({ type: 'SKIP_WAITING' });
      }
    });
  }
</script>
